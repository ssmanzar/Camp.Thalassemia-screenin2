<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Thalassemia Screening & Family Register</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <style>
    :root {
      --bg: #eef3f4;
      --sf: #fff;
      --ink: #14262e;
      --mu: #5a6e76;
      --ln: #d3dde0;
      --tl: #0f6b6b;
      --rd: #b3263e;
      --am: #a56d00;
      --gn: #2f7d4f;
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }


    @media(prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #0e1a1e;
        --sf: #16272d;
        --ink: #e6eff1;
        --mu: #9bb0b7;
        --ln: #2a4048;
        --tl: #4cc0c0;
        --rd: #ff7a8f;
        --am: #e8b04a;
        --gn: #6fd197;
        color-scheme: dark
      }
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.5 'Atkinson Hyperlegible', system-ui, sans-serif
    }

    header {
      background: var(--tl);
      color: #fff;
      padding: 14px 20px
    }

    header h1 {
      margin: 0;
      font-size: 1.25rem
    }

    header p {
      margin: 0;
      opacity: .85;
      font-size: .9rem
    }

    nav {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      background: var(--sf);
      border-bottom: 1px solid var(--ln);
      padding: 0 12px
    }

    nav button {
      border: 0;
      background: none;
      color: var(--mu);
      padding: 12px 14px;
      font: inherit;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      white-space: nowrap
    }

    nav button.on {
      color: var(--tl);
      border-color: var(--tl);
      font-weight: 700
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px 16px 60px
    }

    h2 {
      margin: 0 0 12px;
      font-size: 1.3rem
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 18px
    }

    .card {
      background: var(--sf);
      border: 1px solid var(--ln);
      border-radius: 8px;
      padding: 14px;
      text-align: left;
      font: inherit;
      color: inherit
    }

    button.card {
      cursor: pointer
    }

    button.card:hover {
      border-color: var(--tl)
    }

    .card b {
      display: block;
      font-size: 2rem;
      line-height: 1.1
    }

    .card span {
      color: var(--mu);
      font-size: .9rem
    }

    .k-Major b {
      color: var(--rd)
    }

    .k-Carrier b,
    .k-Minor b {
      color: var(--am)
    }

    .k-Normal b {
      color: var(--gn)
    }

    .box {
      background: var(--sf);
      border: 1px solid var(--ln);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 16px;
      overflow-x: auto
    }

    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
      align-items: end
    }

    label {
      display: grid;
      gap: 3px;
      font-size: .85rem;
      color: var(--mu)
    }

    input,
    select {
      font: inherit;
      padding: 8px;
      border: 1px solid var(--ln);
      border-radius: 6px;
      background: var(--bg);
      color: var(--ink);
      min-width: 0
    }

    :focus-visible {
      outline: 3px solid var(--tl);
      outline-offset: 1px
    }

    .btn {
      background: var(--tl);
      color: #fff;
      border: 0;
      border-radius: 6px;
      padding: 9px 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer
    }

    .btn.ghost {
      background: none;
      color: var(--tl);
      border: 1px solid var(--tl)
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: .92rem
    }

    th,
    td {
      text-align: left;
      padding: 8px;
      border-bottom: 1px solid var(--ln);
      white-space: nowrap
    }

    th {
      color: var(--mu);
      font-weight: 700
    }

    .chip {
      display: inline-block;
      padding: 1px 9px;
      border-radius: 99px;
      border: 1px solid currentColor;
      font-size: .8rem
    }

    .c-Major {
      color: var(--rd)
    }

    .c-Minor,
    .c-Carrier,
    .c-Intermedia {
      color: var(--am)
    }

    .c-Normal {
      color: var(--gn)
    }

    .c-Unknown,
    .c-Pending {
      color: var(--mu)
    }

    .tree {
      display: grid;
      gap: 22px;
      justify-items: center
    }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      position: relative
    }

    .node {
      border: 2px solid var(--ln);
      border-radius: 8px;
      background: var(--bg);
      padding: 8px 12px;
      min-width: 140px;
      text-align: center
    }

    .node.Major {
      border-color: var(--rd)
    }

    .node.Carrier,
    .node.Minor,
    .node.Intermedia {
      border-color: var(--am)
    }

    .node.Normal {
      border-color: var(--gn)
    }

    .node small {
      display: block;
      color: var(--mu)
    }

    .bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      align-items: end
    }

    .note {
      color: var(--mu);
      font-size: .85rem
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 999;
      overflow-y: auto;
      padding: 16px;
      align-items: center;
      justify-content: center
    }

    .modal-backdrop.show {
      display: flex
    }

    .modal-card {
      background: var(--sf);
      border-radius: 10px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
      max-width: 640px;
      width: 100%;
      overflow: hidden;
      border: 1px solid var(ln)
    }

    .slip-box {
      padding: 22px;
      background: #fff;
      color: #14262e;
      font-size: 20px;
      border: 1px solid #d3dde0;
      border-radius: 8px;
      margin: 16px
    }

    .slip-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 16px;
      margin: 12px 0
    }

    .slip-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dotted #ccc;
      padding: 4px 0
    }

    .slip-row b {
      color: #334155;
      font-size: 0.88rem
    }

    .slip-row span {
      font-size: 0.92rem;
      font-weight: 500;
      text-align: right
    }

    @media print {

      header,
      nav,
      .bar,
      form,
      .btn,
      #nav,
      .slip-no-print {
        display: none !important
      }

      body {
        background: #fff !important;
        color: #000 !important
      }

      /* ===== 2x2 TOKEN SLIP PRINT: EXACT PAPER SIZE & ZERO MARGINS ===== */
      /* This overrides @page only when printing the token slip */
      body.printing-slip {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      body.printing-slip #app,
      body:has(#slipModal.show) #app {
        display: none !important
      }

      body.printing-slip .modal-backdrop:not(#slipModal),
      body:has(#slipModal.show) .modal-backdrop:not(#slipModal) {
        display: none !important
      }

      body.printing-slip #slipModal,
      body:has(#slipModal.show) #slipModal {
        position: static !important;
        background: none !important;
        display: block !important;
        padding: 0 !important
      }

      body.printing-slip #slipModal .modal-card,
      body:has(#slipModal.show) #slipModal .modal-card {
        box-shadow: none !important;
        border: none !important;
        max-width: 100% !important;
        width: 100% !important;
        background: transparent !important
      }

      body.printing-slip .slip-box:not(.token-slip-box) {
        border: 2px solid #000 !important;
        padding: 16px !important;
        margin: 0 !important;
        border-radius: 0 !important;
        color: #000 !important
      }

      body.printing-slip .slip-row b {
        color: #000 !important
      }

      body.printing-lab-report header,
      body.printing-lab-report nav,
      body.printing-lab-report .bar,
      body.printing-lab-report form,
      body.printing-lab-report .btn,
      body.printing-lab-report #nav,
      body.printing-lab-report .no-print,
      body.printing-lab-report .modal-backdrop,
      body.printing-lab-report .note {
        display: none !important
      }

      body.printing-lab-report {
        background: #fff !important;
        color: #000 !important
      }

      body.printing-lab-report #app {
        padding: 0 !important;
        max-width: 100% !important
      }

      body.printing-lab-report .excel-table-wrap {
        border: 1px solid #1b4d79 !important;
        box-shadow: none !important;
        overflow: visible !important
      }

      body.printing-lab-report .excel-table {
        width: 100% !important;
        font-size: 11pt !important
      }

      body.printing-lab-report .excel-table th {
        background: #1b4d79 !important;
        color: #ffffff !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important
      }

      body.printing-lab-report .excel-table td {
        padding: 6px 10px !important;
        border: 1px solid #c0c0c0 !important
      }

      body.printing-lab-report .cell-remarks.trait {
        background: #fde8d7 !important;
        color: #b34700 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important
      }

      body.printing-lab-report .cell-remarks.normal {
        background: #e6f4ea !important;
        color: #137333 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important
      }

      body.printing-lab-report .cell-remarks.major {
        background: #fee2e2 !important;
        color: #b91c1c !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important
      }

      body.printing-lab-report .lab-print-header,
      body.printing-lab-report .lab-print-footer {
        display: block !important
      }

      @page {
        size: portrait;
      }

      @page :blank {
        margin: 0;
      }

      /* 1x1 token slip page — injected via JS as #print-2x2-style so it
         only applies when window.print() is called for the token slip.
         The rule below ensures zero margins without overriding other pages. */

      body.printing-slip,
      body:has(#slipModal.show) {
        width: 240px !important;
        height: 250px !important;
        max-width: 240px !important;
        max-height: 250px !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #fff !important;
        overflow: hidden !important;
      }

      body.printing-slip #slipModal,
      body:has(#slipModal.show) #slipModal {
        position: static !important;
        background: none !important;
        display: block !important;
        width: 240px !important;
        height: 250px !important;
        max-width: 240px !important;
        max-height: 250px !important;
        margin: 0 !important;
        padding: 0 !important;
        border: none !important;
        box-shadow: none !important;
        overflow: hidden !important;
      }

      body.printing-slip #slipModal .modal-card,
      body:has(#slipModal.show) #slipModal .modal-card {
        box-shadow: none !important;
        border: none !important;
        max-width: 240px !important;
        max-height: 250px !important;
        width: 240px !important;
        height: 250px !important;
        margin: 0 !important;
        padding: 0 !important;
        background: transparent !important;
        overflow: hidden !important;
      }

      body.printing-slip #slipContent,
      body:has(#slipModal.show) #slipContent {
        width: 240px !important;
        height: 250px !important;
        max-width: 240px !important;
        max-height: 250px !important;
        margin: 0 !important;
        padding: 0 !important;
        background: transparent !important;
        overflow: hidden !important;
        display: block !important;
      }

      body.printing-slip .token,
      body:has(#slipModal.show) .token,
      body.printing-slip .token-slip-box,
      body:has(#slipModal.show) .token-slip-box {
        width: 240px !important;
        height: 250px !important;
        max-width: 240px !important;
        max-height: 250px !important;
        min-width: 240px !important;
        min-height: 250px !important;
        box-sizing: border-box !important;
        padding: 14px !important;
        margin: 0 !important;
        border: 2px dashed #000 !important;
        border-radius: 8px !important;
        background: #ffffff !important;
        color: #000000 !important;
        page-break-inside: avoid !important;
        page-break-after: avoid !important;
        box-shadow: none !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        overflow: hidden !important;
        display: block !important;
        font-family: Arial, Helvetica, sans-serif !important;
        font-weight: 900 !important;
      }

      body.printing-camp-report header,
      body.printing-camp-report nav,
      body.printing-camp-report .bar,
      body.printing-camp-report form,
      body.printing-camp-report .btn,
      body.printing-camp-report #nav,
      body.printing-camp-report .no-print,
      body.printing-camp-report .modal-backdrop,
      body.printing-camp-report .note {
        display: none !important
      }

      body.printing-camp-report {
        background: #fff !important;
        color: #000 !important
      }

      body.printing-camp-report #app {
        padding: 0 !important;
        max-width: 100% !important
      }

      body.printing-camp-report .camp-print-header,
      body.printing-camp-report .camp-print-footer {
        display: block !important
      }
    }

    /* Excel Style Lab Report Table (Matching Image 2) */
    .excel-table-wrap {
      overflow-x: auto;
      background: #ffffff;
      border: 1px solid #c7d2d8;
      border-radius: 8px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.07);
      margin-bottom: 16px;
    }

    .excel-table {
      width: 100%;
      border-collapse: collapse;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13.5px;
      color: #1a202c;
      background: #ffffff;
    }

    .excel-table th {
      background: #1b4d79;
      color: #ffffff;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 13px;
      letter-spacing: 0.5px;
      padding: 10px 12px;
      text-align: center;
      border-right: 1px solid rgba(255, 255, 255, 0.35);
      border-bottom: 2px solid #13395c;
      white-space: nowrap;
    }

    .excel-table th:last-child {
      border-right: none;
    }

    .excel-table td {
      padding: 7px 12px;
      border-bottom: 1px solid #dcdcdc;
      border-right: 1px solid #e5e9ec;
      white-space: nowrap;
      vertical-align: middle;
      text-align: center;
      color: #1e293b;
    }

    .excel-table td:last-child {
      border-right: none;
    }

    .excel-table td.col-name {
      text-align: left;
      font-weight: 600;
      text-transform: uppercase;
      color: #0f172a;
    }

    .excel-table tr:hover td {
      background: #f8fafc;
    }

    .excel-tag {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-top: 5px solid #16a34a;
      border-right: 5px solid transparent;
    }

    /* Remarks cell styling matching Image 2 */
    .cell-remarks {
      font-weight: 700 !important;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      padding: 6px 12px !important;
    }

    .cell-remarks.trait {
      background-color: #fde8d7 !important;
      color: #b34700 !important;
    }

    .cell-remarks.normal {
      background-color: #e6f4ea !important;
      color: #137333 !important;
    }

    .cell-remarks.major {
      background-color: #fee2e2 !important;
      color: #b91c1c !important;
    }

    .cell-remarks.other {
      background-color: #f1f5f9 !important;
      color: #475569 !important;
    }

    /* Camp & Token specific styles - 2x2 Inch Token (same as reference screenshot) */
    .token,
    .token-slip-box {
      width: 240px;
      height: 250px;
      max-width: 240px;
      max-height: 250px;
      min-width: 240px;
      min-height: 250px;
      box-sizing: border-box;
      padding: 14px;
      background: #ffffff;
      color: #000000;
      border: 2px dashed #000;
      border-radius: 8px;
      margin: 10px auto;
      display: block;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 900;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .token .title {
      text-align: center;
      font-size: 13px;
      letter-spacing: 4px;
      font-weight: 900;
      color: #000;
    }
    .token .number {
      text-align: center;
      font-size: 36px;
      font-weight: 900;
      color: #000;
      margin: 4px 0 10px;
      padding-bottom: 10px;
      border-bottom: 2px dashed #000;
    }
    .token .row {
      font-size: 15px;
      font-weight: 900;
      color: #000;
      line-height: 1.2;
      margin-bottom: 10px;
    }
    .token .row span {
      margin-left: 4px;
    }

    .token-chip-waiting {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 0.78rem;
      font-weight: 600;
      display: inline-block;
    }

    .token-chip-collected {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 0.78rem;
      font-weight: 600;
      display: inline-block;
    }

    .token-chip-completed {
      background: #e0f2fe;
      color: #0369a1;
      border: 1px solid #bae6fd;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 0.78rem;
      font-weight: 600;
      display: inline-block;
    }
  </style>
</head>

<body>
  <header>
    <h1>KITCC- Thalassemia Screening & Family Register</h1>
    <p>Patients, family tree, family screening and reports</p>
  </header>
  <nav id="nav"></nav>
  <main id="app"></main>
  <div id="slipModal" class="modal-backdrop">
    <div class="modal-card" style="max-width:280px">
      <div class="slip-no-print"
        style="display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--ln);background:var(--sf);gap:10px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:8px" id="slipModalTitleWrap">
          <b style="font-size:1.05rem" id="slipModalTitle">Token (2"x2")</b>
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <button class="btn" onclick="triggerPrintSlip()"
            style="display:inline-flex;align-items:center;gap:6px"><span>🖨️</span> Print Token (2"x2")</button>
          <button class="btn ghost" onclick="closeSlip()">Close</button>
        </div>
      </div>
      <div id="slipContent" style="padding:16px 0;display:flex;justify-content:center;background:#f8fafc"></div>
    </div>
  </div>
  <div id="editModal" class="modal-backdrop">
    <div class="modal-card" style="max-width:680px">
      <div
        style="display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--ln);background:var(--sf)">
        <b style="font-size:1.05rem" id="editModalTitle">Edit Patient Details</b>
        <button class="btn ghost" style="padding:2px 8px;font-size:1.1rem;line-height:1"
          onclick="closeEditModal()">✕</button>
      </div>
      <div id="editModalBody" style="padding:18px"></div>
    </div>
  </div>
  <div id="editScrModal" class="modal-backdrop">
    <div class="modal-card" style="max-width:740px">
      <div
        style="display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--ln);background:var(--sf)">
        <b style="font-size:1.05rem" id="editScrModalTitle">Edit Lab Screening Data</b>
        <button class="btn ghost" style="padding:2px 8px;font-size:1.1rem;line-height:1"
          onclick="closeEditScrModal()">✕</button>
      </div>
      <div id="editScrModalBody" style="padding:18px"></div>
    </div>
  </div>
  <div id="campModal" class="modal-backdrop">
    <div class="modal-card" style="max-width:580px">
      <div
        style="display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--ln);background:var(--sf)">
        <b style="font-size:1.05rem" id="campModalTitle">Screening Camp Management</b>
        <button class="btn ghost" style="padding:2px 8px;font-size:1.1rem;line-height:1"
          onclick="closeCampModal()">✕</button>
      </div>
      <div id="campModalBody" style="padding:18px"></div>
    </div>
  </div>
  <div id="editTokenModal" class="modal-backdrop">
    <div class="modal-card" style="max-width:650px">
      <div
        style="display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--ln);background:var(--sf)">
        <b style="font-size:1.05rem" id="editTokenModalTitle">Edit Camp Token</b>

        <table>
          <thead>
            <tr>
              <th style="width:75px">TOKEN #</th>
              <th style="width:90px">TOKEN ID</th>

              <td><b style="font-size:1.05rem;color:var(--tl)"># ${String(t.tokenNo).padStart(3, '0')}</b></td>
              <td><span style="font-family:monospace;color:var(--mu)">${esc(t.id)}</span></td>
              <td style="font-weight:700;text-transform:uppercase">${esc(t.name)}</td>
              <td>${esc(t.father || '—')}</td>

              <td>${esc(t.age || '?')} yrs / ${esc(t.gender || '—')}</td>
              <td>${esc(t.contact || '—')}</td>

              <td><b style="font-family:monospace;color:#1e4b7a">${esc(t.sampleNo || '—')}</b></td>

              <td>
                <select style="padding:3px 6px;font-size:0.8rem;border-radius:4px" onchange="updateTokenStatus('${t.id}', this.value)">
                  ${opts(['Waiting', 'Sample Collected', 'Completed', 'Cancelled'], t.status)}

              <td class="no-print" style="text-align:center">
                <div style="display:flex;gap:4px;justify-content:center;flex-wrap:wrap">

                  <button class="btn ghost" style="padding:3px 6px;font-size:0.8rem;color:var(--rd);border-color:var(--rd)" onclick="delToken('${t.id}')" title="Delete token">✕</button>

      <div class="camp-print-footer" style="display:none">
        <div style="display:flex;justify-content:space-between;margin-top:35px;padding-top:10px;border-top:1px solid #ccc;font-size:0.85rem">
          <div style="text-align:center;min-width:180px">
            <div style="border-top:1px solid #000;margin-top:35px;padding-top:4px;font-weight:700">Token Registration Desk</div>
          </div>
          <div style="text-align:center;min-width:180px">
            <div style="border-top:1px solid #000;margin-top:35px;padding-top:4px;font-weight:700">Phlebotomist / Lab Team</div>

          </div>

    function campExcelReportTbl(list, isReport = false) {
      return `
      <div style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
        <div>
          <b style="font-size:1.05rem;color:var(--tl)">Camp Participant Lab Report (CBC / HPLC)</b>
          <div style="font-size:0.85rem;color:var(--mu);margin-top:2px">Official lab results for camp participants. Enter HGB, RBC, MCV, HbA1, HbA2, Hb Other &amp; Remarks in Edit Token modal.</div>
        </div>
        <div style="font-size:0.88rem;color:var(--mu);font-weight:600">
          Total: ${list.length} &nbsp;|&nbsp;
          👨 Male: ${list.filter(t => t.gender === 'Male').length} &nbsp;|&nbsp;
          👩 Female: ${list.filter(t => t.gender === 'Female').length}
        </div>
      </div>
      <div class="excel-table-wrap">
        <table class="excel-table">
          <thead>
            <tr>
              <th style="width:50px">S.NO</th>
              <th style="width:80px">TOKEN #</th>
              <th style="width:95px">SAMPLE NO</th>
              <th style="text-align:left;min-width:140px">NAME</th>
              <th style="width:65px">AGE</th>
              <th style="width:75px">HGB</th>
              <th style="width:75px">RBC</th>
              <th style="width:75px">MCV</th>
              <th style="width:85px">HBA1</th>
              <th style="width:85px">HBA2</th>
              <th style="min-width:95px">HB OTHER</th>
              <th style="min-width:170px">REMARKS</th>
              ${!isReport ? '<th class="no-print" style="width:140px">ACTIONS</th>' : ''}
            </tr>
          </thead>
          <tbody>
            ${list.length ? list.map((t, idx) => {
        const remCls = t.labRemarks ? remarksClass(t.labRemarks) : '';
        return `
              <tr>
                <td style="font-weight:600">${idx + 1}</td>
                <td style="font-weight:700;color:var(--tl)"># ${String(t.tokenNo).padStart(3, '0')}</td>
                <td style="font-weight:600;color:#1e4b7a">${esc(t.sampleNo || '—')}</td>
                <td class="col-name">${esc(t.name || '—')}</td>
                <td style="position:relative">${esc(t.age ?? '—')}<span class="excel-tag"></span></td>
                <td>${esc(t.hgb || '—')}</td>
                <td>${esc(t.rbc || '—')}</td>
                <td>${esc(t.mcv || '—')}</td>
                <td>${esc(t.hba1 || '—')}</td>
                <td>${esc(t.hba2 || '—')}</td>
                <td>${esc(t.hbOther || '—')}</td>
                <td class="cell-remarks ${remCls}">${esc(t.labRemarks || (t.labResult ? t.labResult.toUpperCase() : '—'))}</td>
                ${!isReport ? `
                <td class="no-print">
                  <div style="display:flex;gap:4px;justify-content:center">
                    <button class="btn ghost" style="padding:3px 8px;font-size:0.8rem;color:var(--tl);border-color:var(--tl)" onclick="editTokenLab('${t.id}')" title="Enter lab results">🔬 Lab Data</button>
                    <button class="btn ghost" style="padding:3px 8px;font-size:0.8rem" onclick="printTokenSlip('${t.id}')" title="Print Token Slip">🖨️</button>
                  </div>
                </td>` : ''}
              </tr>`;
      }).join('') : `<tr><td colspan="${!isReport ? 13 : 12}" style="text-align:center;padding:24px;color:#64748b">No tokens found. Add participants and enter lab data via "🔬 Lab Data" button.</td></tr>`}
          </tbody>
        </table>
      </div>`;
    }

    function editTokenLab(id) {
      const t = db.tokens.find(x => x.id === id);
      if (!t) return;
      document.getElementById('editTokenModalTitle').textContent = `Lab Data Entry – Token #${t.tokenNo} (${esc(t.name)})`;
      document.getElementById('editTokenModalBody').innerHTML = `
        <div style="padding:10px 14px;background:var(--bg);border-radius:6px;display:flex;gap:18px;flex-wrap:wrap;font-size:0.9rem;margin-bottom:14px">
          <div><b>Token #:</b> <span style="color:var(--tl);font-weight:700"># ${String(t.tokenNo).padStart(3, '0')}</span></div>
          <div><b>Name:</b> ${esc(t.name)}</div>
          <div><b>Sample No:</b> <span style="font-weight:700;color:var(--tl)">${esc(t.sampleNo || '—')}</span></div>
          <div><b>Age:</b> ${esc(t.age ?? '—')} yrs</div>
          <div><b>Gender:</b> ${esc(t.gender || '—')}</div>
        </div>
        <form onsubmit="saveTokenLab(event, '${t.id}')" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:12px;align-items:end">
          <div style="grid-column:1/-1;padding:8px 12px;background:var(--sf);border:1px solid var(--ln);border-radius:6px;border-left:3px solid var(--tl)">
            <b style="font-size:0.9rem;color:var(--tl)">🔬 CBC &amp; HPLC Lab Parameters:</b>
          </div>
          <label>HGB (g/dL)<input name="hgb" value="${esc(t.hgb || '')}" placeholder="e.g. 9.8"></label>
          <label>RBC (x10¹²/L)<input name="rbc" value="${esc(t.rbc || '')}" placeholder="e.g. 4.67"></label>
          <label>MCV (fL)<input name="mcv" value="${esc(t.mcv || '')}" placeholder="e.g. 62.0"></label>
          <label>HbA1 (%)<input name="hba1" value="${esc(t.hba1 || '')}" placeholder="e.g. 95.00%"></label>
          <label>HbA2 (%)<input name="hba2" value="${esc(t.hba2 || '')}" placeholder="e.g. 5.00%"></label>
          <label>Hb Other<input name="hbOther" value="${esc(t.hbOther || '')}" placeholder="e.g. —"></label>
          <label style="grid-column:1/-1">Lab Remarks / Diagnosis
            <input name="labRemarks" list="remarksSuggestions" value="${esc(t.labRemarks || '')}" placeholder="e.g. THALASSMIA TRAIT" oninput="onTokenLabRemarksChange(this.value, '${t.id}')">
          </label>
          <label>Lab Result (Verified)
            <select name="labResult" id="tkLabRes_${t.id}">
              <option value="">–</option>
              ${opts(['Major', 'Minor', 'Carrier', 'Intermedia', 'Normal', 'Inconclusive'], t.labResult || '')}
            </select>
          </label>
          <label>Status Update
            <select name="status">
              ${opts(['Waiting', 'Sample Collected', 'Completed', 'Cancelled'], t.status)}
            </select>
          </label>
          <div style="grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;border-top:1px solid var(--ln);padding-top:12px">
            <button type="button" class="btn ghost" style="color:var(--tl);border-color:var(--tl)" onclick="closeEditTokenModal();printTokenSlip('${t.id}')">🖨️ Print Token Slip</button>
            <div style="display:flex;gap:10px">
              <button type="button" class="btn ghost" onclick="closeEditTokenModal()">Cancel</button>
              <button type="submit" class="btn">Save Lab Data</button>
            </div>
          </div>
        </form>`;
      document.getElementById('editTokenModal').classList.add('show');
    }

    function onTokenLabRemarksChange(val, id) {
      const u = (val || '').toUpperCase();
      const resEl = document.getElementById('tkLabRes_' + id);
      if (resEl && !resEl.value) {
        if (u.includes('TRAIT') || u.includes('MINOR')) resEl.value = 'Carrier';
        else if (u.includes('NORMAL')) resEl.value = 'Normal';
        else if (u.includes('MAJOR')) resEl.value = 'Major';
        else if (u.includes('INTERMEDIA')) resEl.value = 'Intermedia';
      }
    }

    function saveTokenLab(e, id) {
      e.preventDefault();
      const t = db.tokens.find(x => x.id === id);
      if (!t) return;
      const f = Object.fromEntries(new FormData(e.target));
      t.hgb = (f.hgb || '').trim();
      t.rbc = (f.rbc || '').trim();
      t.mcv = (f.mcv || '').trim();
      t.hba1 = (f.hba1 || '').trim();
      t.hba2 = (f.hba2 || '').trim();
      t.hbOther = (f.hbOther || '').trim();
      t.labRemarks = (f.labRemarks || '').trim();
      t.labResult = f.labResult || '';
      t.status = f.status || t.status;

      // Auto-detect result from remarks
      if (!t.labResult && t.labRemarks) {
        const ru = t.labRemarks.toUpperCase();
        if (ru.includes('TRAIT') || ru.includes('MINOR')) t.labResult = 'Carrier';
        else if (ru.includes('NORMAL')) t.labResult = 'Normal';
        else if (ru.includes('MAJOR')) t.labResult = 'Major';
        else if (ru.includes('INTERMEDIA')) t.labResult = 'Intermedia';
      }
      if ((t.labResult || t.hgb || t.labRemarks) && t.status === 'Waiting') t.status = 'Completed';

      save();
      closeEditTokenModal();
      // Switch to report view to show result
      window._campView = 'report';
      render();
    }

    function addToken(e, fromDash = false) {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      const campId = f.campId || window._curCampId || (db.camps[0]?.id || 'CMP-001');
      const tokenNo = Number(f.tokenNo) || nextCampTokenNo(campId);
      const id = pad('TK-', db.tokens.length + 1);
      const today = new Date().toISOString().slice(0, 10);
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const sampleNo = (f.sampleNo || '').trim() || ('SMP-' + String(tokenNo).padStart(3, '0'));

      const newToken = {
        id,
        campId,
        tokenNo,
        name: f.name.trim(),
        father: (f.father || '').trim(),
        age: f.age ? Number(f.age) : '',
        gender: f.gender || 'Male',
        contact: (f.contact || '').trim(),
        nic: (f.nic || '').trim(),
        district: (f.district || '').trim(),
        qaum: (f.qaum || '').trim(),
        sampleNo,
        date: today,
        time,
        status: f.status || 'Waiting',
        notes: (f.notes || '').trim()
      };

      db.tokens.push(newToken);
      save();

      if (window._doPrintToken) {
        window._doPrintToken = false;
        printTokenSlip(id, true);
      } else {
        if (fromDash) {
          e.target.reset();
          const nextTk = nextCampTokenNo(campId);
          const tEl = document.getElementById('dash_token_no');
          const sEl = document.getElementById('dash_sample_no');
          if (tEl) tEl.value = nextTk;
          if (sEl) sEl.value = 'SMP-' + String(nextTk).padStart(3, '0');
        }
      }

      render();
    }

    function renderCampTokenSlipHtml(t, camp) {
      const formattedNo = (function (raw) {
        if (!raw) return 'T-0001';
        const str = String(raw).trim();
        if (/^T-\d+$/i.test(str)) return str.toUpperCase();
        const digits = str.replace(/\D/g, '');
        return 'T-' + (digits || '1').padStart(4, '0');
      })(t.tokenNo);

      const empIdVal = t.sampleNo ? esc(t.sampleNo) : esc(t.id || '—');

      return `
        <div class="token token-slip-box">
          <div class="title">TOKEN NUMBER</div>
          <div class="number">${formattedNo}</div>

          <div class="row">Visitor: <span>${esc(t.name || '—')}</span></div>
          <div class="row">Father/Husband: <span>${esc(t.father || '—')}</span></div>
          <div class="row">Emp ID: <span>${empIdVal}</span></div>
          <div class="row">Company: <span>KITCC</span></div>
        </div>`;
    }

    function printTokenSlip(id, autoPrint = false) {
      const t = db.tokens.find(x => x.id === id);
      if (!t) return;
      const camp = db.camps.find(c => c.id === t.campId) || { name: 'Thalassemia Screening Camp', location: 'Karachi' };

      const campTokens = db.tokens.filter(x => x.campId === t.campId);
      const titleEl = document.getElementById('slipModalTitle');
      if (titleEl) {
        if (campTokens.length > 1) {
          titleEl.innerHTML = `
            <span>Token (2"x2") &ndash;</span>
            <select style="font-weight:700;color:var(--tl);padding:2px 6px;margin-left:4px;border:1px solid var(--ln);border-radius:4px;background:var(--sf)" onchange="printTokenSlip(this.value)">
              ${campTokens.map(x => `<option value="${x.id}"${x.id === t.id ? ' selected' : ''}>#${String(x.tokenNo).padStart(3, '0')} - ${esc(x.name)} (${esc(x.sampleNo || x.id)})</option>`).join('')}
            </select>
          `;
        } else {
          titleEl.textContent = `Token #${String(t.tokenNo).padStart(3, '0')} (2"x2") – ${t.name}`;
        }
      }

      document.getElementById('slipContent').innerHTML = renderCampTokenSlipHtml(t, camp);
      document.getElementById('slipModal').classList.add('show');
      if (autoPrint) {
        setTimeout(() => triggerPrintSlip(), 150);
      }
    }

    function printLatestCampToken(campId) {
      const list = campId && campId !== 'all' ? db.tokens.filter(t => t.campId === campId) : db.tokens;
      if (!list || !list.length) {
        alert('No tokens found for this camp yet. Please create a token first.');
        return;
      }
      const latestToken = list[list.length - 1];
      printTokenSlip(latestToken.id, false);
    }

    function printAllCampTokens(campId) {
      const list = campId && campId !== 'all' ? db.tokens.filter(t => t.campId === campId) : db.tokens;
      if (!list || !list.length) {
        alert('No tokens found to print.');
        return;
      }
      const camp = db.camps.find(c => c.id === campId) || db.camps[0] || { name: 'Thalassemia Screening Camp', location: 'Karachi' };

      const titleEl = document.getElementById('slipModalTitle');
      if (titleEl) titleEl.textContent = `All Camp Token Slips (${list.length} Tokens – ${esc(camp.name)})`;

      const slipsHtml = list.map((t, idx) => `
        <div style="page-break-inside:avoid;page-break-after:always;display:flex;justify-content:center;margin-bottom:10px">
          ${renderCampTokenSlipHtml(t, camp)}
        </div>
      `).join('');

      document.getElementById('slipContent').innerHTML = slipsHtml;
      document.getElementById('slipModal').classList.add('show');
    }

    function editToken(id) {
      const t = db.tokens.find(x => x.id === id);
      if (!t) return;
      document.getElementById('editTokenModalTitle').textContent = `Edit Camp Token (Token #${t.tokenNo} – ${esc(t.name)})`;
      document.getElementById('editTokenModalBody').innerHTML = `
        <form onsubmit="saveEditToken(event, '${t.id}')" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;align-items:end">
          <label>Camp
            <select name="campId">
              ${db.camps.map(c => `<option value="${c.id}"${c.id === t.campId ? ' selected' : ''}>${esc(c.name)}</option>`).join('')}
            </select>

    function convertTokenToPat(id) {
      const t = db.tokens.find(x => x.id === id);
      if (!t) return;
      const dup = db.patients.find(p => p.name.toLowerCase() === t.name.toLowerCase() && (t.father && p.father.toLowerCase() === t.father.toLowerCase()));
      if (dup && !confirm(`A patient with this name and father already exists (${dup.id}, MR: ${dup.mrNo || '—'}). Register anyway?`)) return;

      const pid = pad('P-', db.n++);
      const today = new Date().toISOString().slice(0, 10);
      const fid = 'F-' + String(db.families.length + 1).padStart(3, '0');
      db.families.push({ id: fid, head: pid, qaum: t.qaum || '', district: t.district || '', date: today });

      const cleanNum = t.sampleNo ? t.sampleNo.replace(/[^0-9]/g, '') : String(t.tokenNo);
      const mrNo = cleanNum ? ('MR-' + cleanNum) : ('MR-' + String(db.patients.length + 1001));

      const newPat = {
        id: pid,
        mrNo,
        name: t.name,
        father: t.father || '',
        mother: '',
        gender: t.gender || 'Male',
        age: t.age ?? '',
        contact: t.contact || '',
        nic: t.nic || '',
        district: t.district || '',
        qaum: t.qaum || '',
        cat: 'Unknown',
        famId: fid,
        rel: 'Self',
        date: today
      };
      db.patients.push(newPat);

      if (t.sampleNo) {
        db.screens.push({
          id: pad('S-', db.screens.length + 1),
          pid: pid,
          test: 'HPLC',
          sample: t.sampleNo,
          date: today,
          status: 'Sample Collected',
          result: '',
          hgb: '', rbc: '', mcv: '', hba1: '', hba2: '', hbOther: '', remarks: ''
        });
      }

      t.status = 'Completed';
      save();

      if (confirm(`Participant registered successfully!\n\nPatient ID: ${pid}\nMR No: ${mrNo}\nFamily: ${fid}\n\nWould you like to open the Patients tab to view their registration?`)) {
        go('pat');
      } else {
        render();
      }
    }

    function delPat(id) {

      const famObj = db.families.find(f => f.id === p.famId);
      if (famObj && famObj.head === id) {
        const nextMember = db.patients.find(x => x.famId === famObj.id && x.id !== id);
        if (nextMember) {
          famObj.head = nextMember.id;
          nextMember.rel = 'Self';

          db.families = db.families.filter(f => f.id !== famObj.id);
          if (fam === famObj.id) fam = db.families[0]?.id || '';

      render();

    let scrPid = '';

          <div style="display:inline-flex;background:var(--sf);border:1px solid var(--ln);border-radius:6px;overflow:hidden">
            <button type="button" class="btn ${sView === 'excel' ? '' : 'ghost'}" style="border-radius:0;border:none;padding:7px 14px;font-size:0.88rem" onclick="window._scrView='excel';render()">
              📊 Excel Lab Report

            <button type="button" class="btn ${sView === 'status' ? '' : 'ghost'}" style="border-radius:0;border:none;padding:7px 14px;font-size:0.88rem" onclick="window._scrView='status';render()">

          <button type="button" class="btn" onclick="exportLabReportCsv()" style="display:inline-flex;align-items:center;gap:6px" title="Export this table in the exact same format to Excel">
            <span>📊</span> Export Excel
          </button>
        </div>

      <div class="box" style="padding:10px">
        ${sView === 'excel' ? excelReportTbl(list) : `
          <div style="overflow-x:auto">
            ${list.length ? tbl(['ID', 'Member', 'Family', 'Test', 'Sample', 'Date', 'Status', 'Result (verified)', 'Action'], list.map(s => {
        const p = P(s.pid); return [
          s.id, esc(p.name), p.famId, s.test, esc(s.sample), s.date,
          `<select id="st_${s.id}" onchange="onScrChange('${s.id}')">${opts(STAT, s.status)}</select>`,
          `<select id="res_${s.id}" onchange="onScrChange('${s.id}')"><option value="">–</option>${opts(RES, s.result)}</select>`,

                  <span id="ok_${s.id}" style="color:var(--gn);font-size:0.85rem;font-weight:700;display:none">Saved ✔</span>
                </div>`
        ]
      })) : `<div class="note" style="padding:14px;text-align:center">No screening records found.</div>`}

      <div class="lab-print-footer" style="display:none">
        <div style="display:flex;justify-content:space-between;margin-top:35px;padding-top:10px;border-top:1px solid #ccc;font-size:0.85rem">
          <div style="text-align:center;min-width:180px">
            <div style="border-top:1px solid #000;margin-top:35px;padding-top:4px;font-weight:700">Lab Technologist</div>

    function onScrMemberChange(pid) {
      const p = P(pid);
      const sampleInput = document.getElementById('scr_sample_input');
      if (sampleInput && (!sampleInput.value || sampleInput.value.startsWith('LAB-'))) {
        sampleInput.value = 'LAB-' + (p.mrNo ? p.mrNo.replace(/[^0-9]/g, '') || p.id.replace(/[^0-9]/g, '') : p.id.replace(/[^0-9]/g, ''));
      }
    }

    function onScrResultChange(res) {
      const remInput = document.getElementById('scr_remarks_input');
      const stSelect = document.getElementById('scr_status_select');
      if (res && stSelect && stSelect.value === 'Pending') stSelect.value = 'Completed';
      if (remInput && !remInput.value) {
        if (res === 'Carrier' || res === 'Minor') remInput.value = 'THALASSMIA TRAIT';
        else if (res === 'Normal') remInput.value = 'NORMAL';
        else if (res === 'Major') remInput.value = 'THALASSEMIA MAJOR';
        else if (res === 'Intermedia') remInput.value = 'THALASSEMIA INTERMEDIA';
      }
    }

    function onScrRemarksChange(val) {
      const u = (val || '').toUpperCase();
      const resSelect = document.getElementById('scr_result_select');
      const stSelect = document.getElementById('scr_status_select');
      if (u) {
        if (stSelect && stSelect.value === 'Pending') stSelect.value = 'Completed';
        if (resSelect && !resSelect.value) {
          if (u.includes('TRAIT') || u.includes('MINOR')) resSelect.value = 'Carrier';
          else if (u.includes('NORMAL')) resSelect.value = 'Normal';
          else if (u.includes('MAJOR')) resSelect.value = 'Major';
          else if (u.includes('INTERMEDIA')) resSelect.value = 'Intermedia';
        }
      }
    }

    function onScrChange(id) { const st = document.getElementById('st_' + id), res = document.getElementById('res_' + id); if (res && res.value && st && st.value === 'Pending') st.value = 'Completed'; const ok = document.getElementById('ok_' + id); if (ok) ok.style.display = 'none' }
    function saveScrRow(id) {
      const s = db.screens.find(x => x.id === id); if (!s) return;
      const stEl = document.getElementById('st_' + id), resEl = document.getElementById('res_' + id);
      const stVal = stEl ? stEl.value : s.status, resVal = resEl ? resEl.value : s.result;
      s.status = (resVal && stVal === 'Pending') ? 'Completed' : stVal;
      s.result = resVal;
      if (!s.remarks && resVal) {
        if (resVal === 'Carrier' || resVal === 'Minor') s.remarks = 'THALASSMIA TRAIT';
        else if (resVal === 'Normal') s.remarks = 'NORMAL';
        else if (resVal === 'Major') s.remarks = 'THALASSEMIA MAJOR';
      }
      if (stEl && s.status !== stVal) stEl.value = s.status;
      if (resVal && resVal !== 'Inconclusive') { const p = P(s.pid); if (p) p.cat = resVal }
      save();
      const sFlt = window._scrFlt || 'all';
      if ((s.status === 'Completed' || resVal) && sFlt === 'open') { render() }
      else { const ok = document.getElementById('ok_' + id); if (ok) { ok.style.display = 'inline'; setTimeout(() => { if (ok) ok.style.display = 'none' }, 2500) } }
    }

    function addScr(e) {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      let st = f.status || 'Pending';
      let res = f.result || '';
      const rem = (f.remarks || '').trim();
      const remU = rem.toUpperCase();

      if ((res || rem || f.hgb) && st === 'Pending') st = 'Completed';
      if (!res && remU) {
        if (remU.includes('TRAIT') || remU.includes('MINOR')) res = 'Carrier';
        else if (remU.includes('NORMAL')) res = 'Normal';
        else if (remU.includes('MAJOR')) res = 'Major';
      }

      db.screens.push({
        id: pad('S-', db.screens.length + 1),
        pid: f.pid,
        test: f.test,
        sample: (f.sample || '').trim(),
        date: f.date,
        status: st,
        result: res,
        hgb: (f.hgb || '').trim(),
        rbc: (f.rbc || '').trim(),
        mcv: (f.mcv || '').trim(),
        hba1: (f.hba1 || '').trim(),
        hba2: (f.hba2 || '').trim(),
        hbOther: (f.hbOther || '').trim(),
        remarks: rem
      });

      if (res && res !== 'Inconclusive') {
        const p = P(f.pid);
        if (p) p.cat = res;
      }
      scrPid = '';
      save();
      render();
    }

    function editScr(id) {
      const s = db.screens.find(x => x.id === id);
      if (!s) return;
      const p = P(s.pid);
      document.getElementById('editScrModalTitle').textContent = `Edit Lab Screening Data (${esc(p.name)} – ${esc(p.mrNo || s.sample)})`;
      document.getElementById('editScrModalBody').innerHTML = `
        <form onsubmit="saveEditScr(event, '${s.id}')" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end">
          <div style="grid-column:1/-1;padding:10px 14px;background:var(--bg);border-radius:6px;display:flex;gap:18px;flex-wrap:wrap;font-size:0.9rem">

            <input name="sample" value="${esc(s.sample || '')}" required>
          </label>

            <input name="date" type="date" value="${esc(s.date || '')}">
          </label>
          <label>Status
            <select name="status">${opts(STAT, s.status)}</select>
          </label>
          <label>Result (verified)
            <select name="result"><option value="">–</option>${opts(RES, s.result)}</select>
          </label>
          
          <div style="grid-column:1/-1;margin-top:6px;padding-top:12px;border-top:1px dashed var(--ln)">
            <b style="display:block;margin-bottom:8px;color:var(--tl);font-size:0.95rem">
              🔬 CBC &amp; HPLC Lab Parameters (Image 2 Style):
            </b>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px">
              <label>HGB (g/dL)<input name="hgb" value="${esc(s.hgb || '')}" placeholder="e.g. 9.8"></label>
              <label>RBC (x10¹²/L)<input name="rbc" value="${esc(s.rbc || '')}" placeholder="e.g. 4.67"></label>
              <label>MCV (fL)<input name="mcv" value="${esc(s.mcv || '')}" placeholder="e.g. 62.0"></label>
              <label>HbA1 (%)<input name="hba1" value="${esc(s.hba1 || '')}" placeholder="e.g. 95.00%"></label>
              <label>HbA2 (%)<input name="hba2" value="${esc(s.hba2 || '')}" placeholder="e.g. 5.00%"></label>
              <label>Hb Other<input name="hbOther" value="${esc(s.hbOther || '')}" placeholder="e.g. -"></label>
              <label>Remarks<input name="remarks" list="remarksSuggestions" value="${esc(s.remarks || '')}" placeholder="e.g. THALASSMIA TRAIT"></label>
            </div>
          </div>
          
          <div style="grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;border-top:1px solid var(--ln);padding-top:14px">
            <button type="button" class="btn ghost" style="color:var(--rd);border-color:var(--rd)" onclick="closeEditScrModal();delScr('${s.id}')">Delete Test</button>

              <button type="button" class="btn ghost" style="color:var(--tl);border-color:var(--tl)" onclick="closeEditScrModal();printScrSlip('${s.id}')">🖨️ Print Slip</button>
              <button type="button" class="btn ghost" onclick="closeEditScrModal()">Cancel</button>
              <button type="submit" class="btn">Save Lab Data</button>
            </div>
          </div>
        </form>`;
      document.getElementById('editScrModal').classList.add('show');
    }

    function closeEditScrModal() {
      document.getElementById('editScrModal').classList.remove('show');
    }

    function saveEditScr(e, id) {
      e.preventDefault();
      const s = db.screens.find(x => x.id === id);
      if (!s) return;
      const f = Object.fromEntries(new FormData(e.target));
      s.test = f.test;
      s.sample = (f.sample || '').trim();
      s.date = f.date;
      s.status = f.status;
      s.result = f.result;
      s.hgb = (f.hgb || '').trim();
      s.rbc = (f.rbc || '').trim();
      s.mcv = (f.mcv || '').trim();
      s.hba1 = (f.hba1 || '').trim();
      s.hba2 = (f.hba2 || '').trim();
      s.hbOther = (f.hbOther || '').trim();
      s.remarks = (f.remarks || '').trim();

      const remU = s.remarks.toUpperCase();
      if (!s.result && remU) {
        if (remU.includes('TRAIT') || remU.includes('MINOR')) s.result = 'Carrier';
        else if (remU.includes('NORMAL')) s.result = 'Normal';
        else if (remU.includes('MAJOR')) s.result = 'Major';
      }
      if ((s.result || s.remarks || s.hgb) && s.status === 'Pending') s.status = 'Completed';

      if (s.result && s.result !== 'Inconclusive') {
        const p = P(s.pid);
        if (p) p.cat = s.result;
      }
      save();
      closeEditScrModal();
      render();
    }

    function delScr(id) {
      const s = db.screens.find(x => x.id === id);
      if (!s) return;
      const p = P(s.pid);
      if (!confirm(`Are you sure you want to delete screening test (${s.sample || s.id}) for "${p.name || 'this patient'}"?`)) return;
      db.screens = db.screens.filter(x => x.id !== id);
      save();
      render();
    }

    function printLabReport() {
      document.body.classList.add('printing-lab-report');
      window.print();
    }

    function exportLabReportCsv() {
      const cols = ['S.NO', 'MR.NO', 'NAME', 'AGE', 'HGB', 'RBC', 'MCV', 'HBA1', 'HBA2', 'HB OTHER', 'REMARKS', 'TEST', 'SAMPLE NO', 'SAMPLE DATE', 'STATUS'];
      const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
      const rows = db.screens.map((s, idx) => {
        const p = P(s.pid);
        return [
          idx + 1,
          p.mrNo || s.sample || '',
          (p.name || '').toUpperCase(),
          p.age ?? '',
          s.hgb || '',
          s.rbc || '',
          s.mcv || '',
          s.hba1 || '',
          s.hba2 || '',
          s.hbOther || '',
          s.remarks || (s.result ? s.result.toUpperCase() : ''),
          s.test || '',
          s.sample || '',
          s.date || '',
          s.status || ''
        ];
      });
      const s = '\ufeff' + [cols, ...rows].map(r => r.map(q).join(',')).join('\r\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([s], { type: 'text/csv;charset=utf-8;' }));
      a.download = `thalassemia-screening-lab-report-${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function rep() {
      const t = window._rt || 'Family Screening Lab Report (CBC & HPLC)';
      const T = [
        'Family Screening Lab Report (CBC & HPLC)',
        'Camp-wise Tokens Summary',
        'Gender-wise (Male / Female)',
        'All patients',
        ...CATS.slice(0, 5).map(c => c + ' patients'),
        'Pending screening',
        'Completed screening',
        'Qaum-wise',
        'District-wise'
      ];
      const isLabRep = t === 'Family Screening Lab Report (CBC & HPLC)';
      const maleCount = db.patients.filter(p => p.gender === 'Male').length;
      const femaleCount = db.patients.filter(p => p.gender === 'Female').length;
      const otherCount = db.patients.filter(p => p.gender && p.gender !== 'Male' && p.gender !== 'Female').length;

      return `<h2>Reports & export</h2>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:14px">
        <div class="card" style="padding:10px 14px">
          <b style="font-size:1.6rem">${db.patients.length}</b>
          <span>Total Patients</span>
        </div>

          <b style="font-size:1.6rem;color:#1e4b7a">${maleCount}</b>
          <span>👨 Male Patients</span>
        </div>
        <div class="card" style="padding:10px 14px">
          <b style="font-size:1.6rem;color:#b3263e">${femaleCount}</b>
          <span>👩 Female Patients</span>
        </div>
        ${otherCount ? `
        <div class="card" style="padding:10px 14px">
          <b style="font-size:1.6rem;color:var(--mu)">${otherCount}</b>
          <span>Other Gender</span>
        </div>` : ''}
      </div>

      <div class="bar">
        <label>Report
          <select onchange="window._rt=this.value;render()">${opts(T, t)}</select>
        </label>
        <button class="btn" onclick="${isLabRep ? 'exportLabReportCsv()' : 'csv()'}">Export Excel (CSV)</button>
        <button class="btn ghost" onclick="${isLabRep ? 'printLabReport()' : 'window.print()'}">Print / Save PDF</button>
      </div>
      <div class="box">
        ${isLabRep ? `
          <div style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
            <div>
              <b style="font-size:1.05rem;color:var(--tl)">Family Screening Laboratory Report (CBC / HPLC)</b>
              <div style="font-size:0.85rem;color:var(--mu);margin-top:2px">Official laboratory table format with parameters (HGB, RBC, MCV, HbA1, HbA2, Hb Other, Remarks) matching the screening register.</div>
            </div>
            <div style="font-size:0.88rem;color:var(--mu);font-weight:600">
              Total Screened: ${db.screens.length} &nbsp;|&nbsp; 👨 Male: ${db.screens.filter(s => P(s.pid).gender === 'Male').length} &nbsp;|&nbsp; 👩 Female: ${db.screens.filter(s => P(s.pid).gender === 'Female').length}
            </div>
          </div>
          ${excelReportTbl(db.screens, true)}
        ` : ((window._rep = repData(t)), tbl(window._rep.c, window._rep.r))}
      </div>`;
    }

    function repData(t) {
      const c1 = ['ID', 'MR No', 'Name', 'Father', 'Gender', 'Age', 'District', 'Qaum', 'Family', 'Category'];
      const pr = p => [p.id, esc(p.mrNo || '—'), esc(p.name), esc(p.father), esc(p.gender || '—'), esc(p.age), esc(p.district), esc(p.qaum), p.famId, chip(p.cat)];

      if (t === 'Camp-wise Tokens Summary') {
        return {
          c: ['Camp ID', 'Camp Name', 'Date', 'Location', 'Incharge', 'Total Tokens', 'Male', 'Female', 'Samples Collected', 'Waiting'],
          r: db.camps.map(c => {
            const ts = db.tokens.filter(tk => tk.campId === c.id);
            return [
              c.id,
              esc(c.name),
              c.date || '—',
              esc(c.location || '—'),
              esc(c.incharge || '—'),
              ts.length,
              ts.filter(tk => tk.gender === 'Male').length,
              ts.filter(tk => tk.gender === 'Female').length,
              ts.filter(tk => tk.status === 'Sample Collected' || tk.status === 'Completed').length,
              ts.filter(tk => tk.status === 'Waiting').length
            ];
          })
        };
      }

      if (t === 'Gender-wise (Male / Female)') {
        const genders = ['Male', 'Female', 'Other'];
        const rows = genders.map(g => {
          const ps = db.patients.filter(p => (p.gender || 'Unknown') === g);
          const c = cat => ps.filter(p => p.cat === cat).length;
          const pend = db.screens.filter(s => open(s) && ps.some(p => p.id === s.pid)).length;
          return [
            g === 'Male' ? '👨 Male' : (g === 'Female' ? '👩 Female' : 'Other / Unknown'),
            ps.length,
            c('Major'),
            c('Minor'),
            c('Carrier'),
            c('Intermedia'),
            c('Normal'),
            c('Unknown'),
            pend
          ];
        }).filter(r => r[1] > 0 || r[0].includes('Male') || r[0].includes('Female'));

        const totPs = db.patients;
        const totC = cat => totPs.filter(p => p.cat === cat).length;
        const totPend = db.screens.filter(open).length;
        rows.push([
          '<b>TOTAL</b>',
          `<b>${totPs.length}</b>`,
          `<b>${totC('Major')}</b>`,
          `<b>${totC('Minor')}</b>`,
          `<b>${totC('Carrier')}</b>`,
          `<b>${totC('Intermedia')}</b>`,
          `<b>${totC('Normal')}</b>`,
          `<b>${totC('Unknown')}</b>`,
          `<b>${totPend}</b>`
        ]);

        return {
          c: ['Gender', 'Total Patients', 'Major', 'Minor', 'Carrier', 'Intermedia', 'Normal', 'Not Screened', 'Pending Tests'],
          r: rows
        };
      }

      if (t === 'Qaum-wise' || t === 'District-wise') {
        const k = t === 'Qaum-wise' ? 'qaum' : 'district', g = {};
        db.patients.forEach(p => { const n = p[k] || 'Not recorded'; (g[n] = g[n] || []).push(p) });
        return {
          c: [k === 'qaum' ? 'Qaum' : 'District', 'Families', 'Total Patients', 'Male', 'Female', 'Major', 'Carrier', 'Normal', 'Not screened'],
          r: Object.entries(g).map(([n, ps]) => [
            esc(n),
            new Set(ps.map(p => p.famId)).size,
            ps.length,
            ps.filter(p => p.gender === 'Male').length,
            ps.filter(p => p.gender === 'Female').length,
            ps.filter(p => p.cat === 'Major').length,
            ps.filter(p => p.cat === 'Carrier').length,
            ps.filter(p => p.cat === 'Normal').length,
            ps.filter(p => p.cat === 'Unknown').length
          ])
        };
      }

      if (t === 'Pending screening' || t === 'Completed screening') {
        const w = t[0] === 'P' ? open : s => s.status === 'Completed';
        return {
          c: ['Screening', 'Member', 'Gender', 'Family', 'Test', 'Sample', 'Date', 'Status', 'Result', 'Remarks'],
          r: db.screens.filter(w).map(s => {
            const p = P(s.pid);
            return [s.id, esc(p.name), esc(p.gender || '—'), p.famId, s.test, s.sample, s.date, s.status, s.result || '', s.remarks || ''];
          })
        };
      }

      const c = t.replace(' patients', '');
      return { c: c1, r: db.patients.filter(p => t === 'All patients' || p.cat === c).map(pr) };
    }

    function csv() {

      const s = '\ufeff' + [r.c, ...r.r].map(x => x.map(c => q(clean(c))).join(',')).join('\r\n');
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([s], { type: 'text/csv' })); a.download = 'thalassemia-report.csv'; document.body.appendChild(a); a.click(); a.remove();

    // 2x2 token slip print CSS — injected only during token slip print, removed on afterprint
    // @page with size=240px 250px portrait & margin=0 fully removes browser header/footer/URL/page-number
    const print2x2Css = [
      '@page {',
      '  size: 240px 250px portrait;',
      '  margin: 0;',
      '  margin-top: 0;',
      '  margin-bottom: 0;',
      '  margin-left: 0;',
      '  margin-right: 0;',
      '}',
      '@page :left { margin: 0; }',
      '@page :right { margin: 0; }',
      '@page :first { margin: 0; }',
      'html {',
      '  width: 240px;',
      '  height: 250px;',
      '  margin: 0;',
      '  padding: 0;',
      '  overflow: hidden;',
      '}',
      'body {',
      '  width: 240px;',
      '  height: 250px;',
      '  margin: 0;',
      '  padding: 0;',
      '  overflow: hidden;',
      '}'
    ].join('\n');

    // Save and restore original title so browser print header shows nothing meaningful
    var _origTitle = '';

    function triggerPrintSlip() {
      document.body.classList.add('printing-slip');
      // Clear title to suppress browser auto-header (date + title line)
      _origTitle = document.title;
      document.title = ' ';
      // Remove any existing style and reinject fresh
      const existing = document.getElementById('print-2x2-style');
      if (existing) existing.remove();
      const styleEl = document.createElement('style');
      styleEl.id = 'print-2x2-style';
      styleEl.textContent = print2x2Css;
      document.head.appendChild(styleEl);
      // Small delay to ensure styles are applied before print dialog
      setTimeout(() => { window.print(); }, 80);
    }
    window.addEventListener('afterprint', () => {
      // Restore title after printing
      if (_origTitle) { document.title = _origTitle; _origTitle = ''; }
      document.body.classList.remove('printing-slip');
      document.body.classList.remove('printing-thermal');
      document.body.classList.remove('printing-lab-report');
      document.body.classList.remove('printing-camp-report');
      const styleEl = document.getElementById('print-2x2-style');
      if (styleEl) styleEl.remove();
    });
    window.addEventListener('beforeprint', () => {
      if (document.getElementById('slipModal')?.classList.contains('show')) {
        document.body.classList.add('printing-slip');
        let styleEl = document.getElementById('print-2x2-style');
        if (!styleEl) {
          styleEl = document.createElement('style');
          styleEl.id = 'print-2x2-style';
          styleEl.textContent = print2x2Css;
          document.head.appendChild(styleEl);
        }
      }
    });
    function closeSlip() {
      document.getElementById('slipModal').classList.remove('show');
      document.body.classList.remove('printing-slip');
      document.body.classList.remove('printing-thermal');
      const styleEl = document.getElementById('print-2x2-style');
      if (styleEl) styleEl.remove();
    }

    function saveEditPat(e, id) {
      e.preventDefault();
      const p = P(id);
      if (!p) return;
      const f = Object.fromEntries(new FormData(e.target));
      p.mrNo = (f.mrNo || '').trim();
      p.name = f.name.trim();
      p.father = f.father;
      p.mother = f.mother;
      p.age = f.age;
      p.gender = f.gender;
      p.nic = (f.nic || '').trim();
      p.contact = f.contact;
      p.district = f.district;
      p.qaum = f.qaum;
      p.cat = f.cat;
      p.famId = f.famId;
      p.rel = f.rel;
      save();
      closeEditModal();
      render();
    }

    window.addEventListener('keydown', e => { if (e.key === 'Escape') { closeEditModal(); closeSlip(); closeEditScrModal(); closeCampModal(); closeEditTokenModal(); } });

    render();
